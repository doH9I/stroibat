<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>BuildCRM - Сметы</title>
    <link rel="stylesheet" href="styles/main.css?v=1.0">
    <link rel="stylesheet" href="styles/app.css?v=1.0">
    <link rel="stylesheet" href="styles/estimates.css?v=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-building"></i> BuildCRM</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html" class="nav-link">
                        <i class="fas fa-tachometer-alt"></i> Дашборд
                    </a></li>
                    <li><a href="projects.html" class="nav-link">
                        <i class="fas fa-project-diagram"></i> Проекты
                    </a></li>
                    <li><a href="estimates.html" class="nav-link active">
                        <i class="fas fa-calculator"></i> Сметы
                    </a></li>
                    <li><a href="employees.html" class="nav-link">
                        <i class="fas fa-users"></i> Сотрудники
                    </a></li>
                    <li><a href="timesheet.html" class="nav-link">
                        <i class="fas fa-clock"></i> Табель
                    </a></li>
                    <li><a href="analytics.html" class="nav-link">
                        <i class="fas fa-chart-line"></i> Аналитика
                    </a></li>
                    <li><a href="calendar.html" class="nav-link">
                        <i class="fas fa-calendar-alt"></i> Календарь
                    </a></li>
                    <li><a href="reports.html" class="nav-link">
                        <i class="fas fa-file-alt"></i> Отчеты
                    </a></li>
                    <li><a href="settings.html" class="nav-link">
                        <i class="fas fa-cog"></i> Настройки
                    </a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <img src="https://via.placeholder.com/40" alt="User" class="user-avatar">
                    <div class="user-details">
                        <span class="user-name">Администратор</span>
                        <span class="user-role">Руководитель</span>
                    </div>
                </div>
                <button onclick="logout()" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Верхняя панель -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <button onclick="toggleSidebar()" class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>Сметы</h1>
                </div>
                <div class="top-bar-right">
                    <button onclick="createEstimate()" class="btn-primary">
                        <i class="fas fa-plus"></i> Новая смета
                    </button>
                </div>
            </header>

            <!-- Контент смет -->
            <div class="content-wrapper">
                <div class="estimates-section">
                    <div class="estimates-grid">
                        <div class="estimate-card">
                            <h3>Смета: Офисный центр "Альфа"</h3>
                            <p>Материалы и работы для строительства</p>
                            <div class="estimate-total">Сумма: 850,000 ₽</div>
                            <div class="estimate-actions">
                                <button onclick="viewEstimate(1)" class="btn-secondary">Просмотр</button>
                                <button onclick="editEstimate(1)" class="btn-primary">Редактировать</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/utils.js"></script>
    <script>
        function logout() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                window.location.href = 'index.html';
            }
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('collapsed');
        }

        function createEstimate() {
            alert('Создание новой сметы');
        }

        function viewEstimate(id) {
            alert('Просмотр сметы #' + id);
        }

        function editEstimate(id) {
            alert('Редактирование сметы #' + id);
        }
    </script>
</body>
</html>
