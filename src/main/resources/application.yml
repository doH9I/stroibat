spring:
  application:
    name: construction-crm
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.construction.crm: DEBUG
    org.springframework.security: DEBUG

jwt:
  secret: c2VjcmV0LWtleS1mb3ItY29uc3RydWN0aW9uLWNybS1zeXN0ZW0tMjAyNC1hbmQtMjAyNS1hbmQtbXVjaC1sb25nZXItdGhhbi1iZWZvcmU=
  expiration: 86400000 # 24 hours

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:8080"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"