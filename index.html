<!DOCTYPE html>
<!-- 
    ИСПРАВЛЕНИЯ ДЛЯ ПРОБЛЕМ СО СТИЛЯМИ:
    1. Добавлены недостающие CSS файлы (employees.css, timesheet.css)
    2. Исправлены классы input (добавлен class="form-control")
    3. Добавлены мета-теги для сброса кеша браузера
    4. Добавлена версионность к основным CSS файлам
    5. Изменен порядок загрузки CSS (auth.css загружается раньше)
    
    Если проблема все еще есть, попробуйте:
    - Открыть auth-only.html для тестирования только формы авторизации
    - Проверить консоль браузера (F12) на наличие ошибок
    - Очистить кеш браузера (Ctrl+F5)
    - Проверить, что сервер запущен (python3 -m http.server 8000)
-->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>BuildCRM - Система управления строительными проектами</title>
    <link rel="stylesheet" href="styles/main.css?v=1.0">
    <link rel="stylesheet" href="styles/auth.css?v=1.0">
    <link rel="stylesheet" href="styles/app.css?v=1.0">
    <!-- Остальные CSS файлы подключим после решения основной проблемы -->
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="stylesheet" href="styles/projects.css">
    <link rel="stylesheet" href="styles/estimates.css">
    <link rel="stylesheet" href="styles/employees.css">
    <link rel="stylesheet" href="styles/timesheet.css">
    <link rel="stylesheet" href="styles/analytics.css">
    <link rel="stylesheet" href="styles/calendar.css">
    <link rel="stylesheet" href="styles/reports.css">
    <link rel="stylesheet" href="styles/settings.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Авторизация -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1><i class="fas fa-building"></i> BuildCRM</h1>
                <p>Система управления строительными проектами</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            <div class="auth-footer">
                <p>Демо доступ: admin@buildcrm.com / admin123</p>
            </div>
        </div>
    </div>

    <!-- Основное приложение -->
    <div id="app-container" class="app-container hidden">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-building"></i> BuildCRM</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#dashboard" class="nav-link active" data-section="dashboard">
                        <i class="fas fa-tachometer-alt"></i> Дашборд
                    </a></li>
                    <li><a href="#projects" class="nav-link" data-section="projects">
                        <i class="fas fa-project-diagram"></i> Проекты
                    </a></li>
                    <li><a href="#estimates" class="nav-link" data-section="estimates">
                        <i class="fas fa-calculator"></i> Сметы
                    </a></li>
                    <li><a href="#employees" class="nav-link" data-section="employees">
                        <i class="fas fa-users"></i> Сотрудники
                    </a></li>
                    <li><a href="#timesheet" class="nav-link" data-section="timesheet">
                        <i class="fas fa-clock"></i> Табель
                    </a></li>
                    <li><a href="#analytics" class="nav-link" data-section="analytics">
                        <i class="fas fa-chart-line"></i> Аналитика
                    </a></li>
                    <li><a href="#calendar" class="nav-link" data-section="calendar">
                        <i class="fas fa-calendar-alt"></i> Календарь
                    </a></li>
                    <li><a href="#reports" class="nav-link" data-section="reports">
                        <i class="fas fa-file-alt"></i> Отчеты
                    </a></li>
                    <li><a href="#settings" class="nav-link" data-section="settings">
                        <i class="fas fa-cog"></i> Настройки
                    </a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <img src="https://via.placeholder.com/40" alt="User" class="user-avatar">
                    <div class="user-details">
                        <span class="user-name">Администратор</span>
                        <span class="user-role">Руководитель</span>
                    </div>
                </div>
                <button id="logout-btn" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Верхняя панель -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <button id="sidebar-toggle" class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 id="page-title">Дашборд</h1>
                </div>
                <div class="top-bar-right">
                    <div class="notifications">
                        <button class="notification-btn">
                            <i class="fas fa-bell"></i>
                            <span class="notification-badge">3</span>
                        </button>
                    </div>
                    <div class="search">
                        <input type="text" placeholder="Поиск..." id="global-search">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
            </header>

            <!-- Контейнеры для секций -->
            <div id="dashboard-section" class="content-section active">
                <!-- Дашборд будет загружен через JavaScript -->
            </div>

            <div id="projects-section" class="content-section">
                <!-- Проекты будут загружены через JavaScript -->
            </div>

            <div id="estimates-section" class="content-section">
                <!-- Сметы будут загружены через JavaScript -->
            </div>

            <div id="employees-section" class="content-section">
                <!-- Сотрудники будут загружены через JavaScript -->
            </div>

            <div id="timesheet-section" class="content-section">
                <!-- Табель будет загружен через JavaScript -->
            </div>

            <div id="analytics-section" class="content-section">
                <!-- Аналитика будет загружена через JavaScript -->
            </div>

            <div id="calendar-section" class="content-section">
                <!-- Календарь будет загружен через JavaScript -->
            </div>

            <div id="reports-section" class="content-section">
                <!-- Отчеты будут загружены через JavaScript -->
            </div>

            <div id="settings-section" class="content-section">
                <!-- Настройки будут загружены через JavaScript -->
            </div>
        </main>
    </div>

    <!-- Модальные окна -->
    <div id="modal-container" class="modal-container hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Заголовок</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Содержимое модального окна -->
            </div>
        </div>
    </div>

    <!-- Уведомления -->
    <div id="notifications-container" class="notifications-container"></div>

    <!-- Скрипты -->
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/estimates.js"></script>
    <script src="js/employees.js"></script>
    <script src="js/timesheet.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
