<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildCRM - Аналитика</title>
    <link rel="stylesheet" href="styles/main.css?v=1.0">
    <link rel="stylesheet" href="styles/app.css?v=1.0">
    <link rel="stylesheet" href="styles/analytics.css?v=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-building"></i> BuildCRM</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Дашборд</a></li>
                    <li><a href="projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> Проекты</a></li>
                    <li><a href="estimates.html" class="nav-link"><i class="fas fa-calculator"></i> Сметы</a></li>
                    <li><a href="employees.html" class="nav-link"><i class="fas fa-users"></i> Сотрудники</a></li>
                    <li><a href="timesheet.html" class="nav-link"><i class="fas fa-clock"></i> Табель</a></li>
                    <li><a href="analytics.html" class="nav-link active"><i class="fas fa-chart-line"></i> Аналитика</a></li>
                    <li><a href="calendar.html" class="nav-link"><i class="fas fa-calendar-alt"></i> Календарь</a></li>
                    <li><a href="reports.html" class="nav-link"><i class="fas fa-file-alt"></i> Отчеты</a></li>
                    <li><a href="settings.html" class="nav-link"><i class="fas fa-cog"></i> Настройки</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <img src="https://via.placeholder.com/40" alt="User" class="user-avatar">
                    <div class="user-details">
                        <span class="user-name">Администратор</span>
                        <span class="user-role">Руководитель</span>
                    </div>
                </div>
                <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button onclick="toggleSidebar()" class="sidebar-toggle"><i class="fas fa-bars"></i></button>
                    <h1>Аналитика</h1>
                </div>
            </header>
            <div class="content-wrapper">
                <div class="analytics-section">
                    <h2>Аналитические отчеты</h2>
                    <p>Здесь будет отображаться детальная аналитика по проектам, сотрудникам и финансам.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="js/utils.js"></script>
    <script>
        function logout() { if (confirm('Вы уверены, что хотите выйти?')) window.location.href = 'index.html'; }
        function toggleSidebar() { document.querySelector('.sidebar').classList.toggle('collapsed'); }
    </script>
</body>
</html>
